<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Révise</title>
    <meta name="theme-color" content="#141420">
    <meta name="description" content="App de révision personnalisée, scrollable comme un feed.">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Révise">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="topbar">
        <span id="progress" class="progress">0 / 0</span>
        <div class="topbar-actions">
            <button id="shuffleBtn" class="icon-btn" title="Mélanger" aria-label="Mélanger les cartes">🔀</button>
            <button id="manageBtn" class="icon-btn" title="Gérer mes fiches" aria-label="Gérer mes fiches">☰</button>
        </div>
    </header>

    <main id="deck" class="deck"></main>

    <div id="emptyState" class="empty-state hidden">
        <p>Tu n'as encore aucune fiche.</p>
        <button id="emptyAddBtn" class="btn-primary">Ajouter une fiche</button>
    </div>

    <button id="addBtn" class="fab" aria-label="Ajouter une fiche">+</button>

    <!-- Add / edit card form -->
    <div id="cardModal" class="modal hidden">
        <div class="modal-sheet">
            <h2 id="modalTitle">Nouvelle fiche</h2>
            <label for="questionInput">Question / recto</label>
            <textarea id="questionInput" rows="3" placeholder="Ex : Capitale de l'Australie ?"></textarea>
            <label for="answerInput">Réponse / verso</label>
            <textarea id="answerInput" rows="3" placeholder="Ex : Canberra"></textarea>
            <label for="categoryInput">Catégorie (optionnel)</label>
            <input id="categoryInput" type="text" placeholder="Ex : Géographie">
            <div class="modal-actions">
                <button id="deleteCardBtn" class="btn-danger hidden">Supprimer</button>
                <div class="modal-actions-right">
                    <button id="cancelBtn" class="btn-secondary">Annuler</button>
                    <button id="saveBtn" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Manage / list all cards -->
    <div id="manageModal" class="modal hidden">
        <div class="modal-sheet manage-sheet">
            <h2>Mes fiches</h2>
            <div id="manageList" class="manage-list"></div>
            <div class="modal-actions">
                <button id="resetBtn" class="btn-danger">Réinitialiser</button>
                <button id="closeManageBtn" class="btn-primary">Fermer</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
